name: Deploy S256 Explorer

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy via rsync
        uses: Burnett01/rsync-deployments@7.0.1
        with:
          # Removed --delete to protect local-only files on the VPS
          # Files/folders to never overwrite or touch on the VPS. The action has
          # no exclude input, so they go in switches (run through sh -c, hence
          # the quotes). robots.txt is included first because the site serves it.
          switches: >-
            -avzr
            --include='/robots.txt'
            --exclude='.git/'
            --exclude='.github/'
            --exclude='node_modules/'
            --exclude='.env'
            --exclude='logs/'
            --exclude='*.mapbackup'
            --exclude='COIN_SUPPLY.txt'
            --exclude='*.txt'
            --exclude='*.md'
          path: ./
          remote_path: /
          remote_host: ${{ secrets.VPS_IP }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}
          remote_port: ${{ secrets.VPS_PORT }}

      # The deploy key on the VPS is restricted to rsync inside /home/janos/explorer
      # and this one reload (see ~/bin/deploy-explorer); it gives no shell. The
      # server's host key is pinned here, so nothing is trusted on first use.
      - name: Reload explorer
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "[$VPS_IP]:$VPS_PORT ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAII/OT4+sIqEJ+rEWj/uNA781YNu7KbUowke84AuagHto" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_IP" reload-explorer
