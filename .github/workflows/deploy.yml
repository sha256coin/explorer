name: Deploy S256 Explorer

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy via rsync
        uses: Burnett01/rsync-deployments@7.0.1
        with:
          # Removed --delete to protect local-only files on the VPS
          # Files/folders to never overwrite or touch on the VPS. The action has
          # no exclude input, so they go in switches (run through sh -c, hence
          # the quotes). robots.txt is included first because the site serves it.
          switches: >-
            -avzr
            --include='/robots.txt'
            --exclude='.git/'
            --exclude='.github/'
            --exclude='node_modules/'
            --exclude='.env'
            --exclude='logs/'
            --exclude='*.mapbackup'
            --exclude='COIN_SUPPLY.txt'
            --exclude='*.txt'
            --exclude='*.md'
          path: ./
          remote_path: /home/janos/explorer
          remote_host: ${{ secrets.VPS_IP }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}
          remote_port: ${{ secrets.VPS_PORT }}

      - name: Restart PM2 Processes
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /home/janos/explorer
            # Install any new dependencies added to package.json
            npm install --production
            # Zero-downtime reload for the Explorer API and Sync processes
            pm2 startOrReload ecosystem.config.js --update-env
