<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | SHA256 Coin</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
        .not-found-wrap {
            min-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .not-found-box {
            max-width: 700px;
        }

        .not-found-code {
            font-size: clamp(3rem, 10vw, 6rem);
            line-height: 1;
            margin-bottom: 1rem;
        }

        .not-found-actions {
            margin-top: 1.5rem;
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .not-found-button {
            display: inline-block;
            padding: 0.7rem 1rem;
            border: 1px solid currentColor;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <main class="not-found-wrap">
        <section class="not-found-box">
            <h1 class="not-found-code">404</h1>
            <h2>Page Not Found</h2>
            <p>The page you requested does not exist or may have been moved.</p>
            <div class="not-found-actions">
                <a class="not-found-button" href="/">Go to Homepage</a>
            </div>
        </section>
    </main>
</body>

</html>
